name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare application for tests
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force
      - run: vendor/bin/pint --test
      - run: npm run check:js
      - run: npm run build
      - run: php artisan test --compact

  map-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      E2E_USERNAME: e2e
      E2E_PASSWORD: e2e-password
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Prepare application
        run: |
          cp .env.example .env
          echo "APP_URL=http://127.0.0.1:8000" >> .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --force
          php artisan tinker --execute="App\\Models\\User::factory()->create(['name'=>'E2E','username'=>'e2e','email'=>'e2e@example.test','password'=>\Illuminate\Support\Facades\Hash::make('e2e-password')]);"
      - name: Start application
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/ci-server.log 2>&1 &
          sleep 5
      - name: Wait for server to be ready
        run: |
          max_attempts=30
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts: Checking server..."
            # Čekaj da server odgovori sa HTML-om (ne samo HTTP zahtjevom)
            response=$(curl -s http://127.0.0.1:8000/prijava 2>&1)
            if echo "$response" | grep -q "csrf-token"; then
              echo "✓ Server is ready and login page is available"
              exit 0
            fi
            if echo "$response" | grep -q "<!DOCTYPE"; then
              echo "HTML loaded but no csrf-token yet. Preview:"
              echo "$response" | grep -o "<meta[^>]*>" | head -5
            fi
            sleep 2
            attempt=$((attempt + 1))
          done
          echo "✗ Server did not start in time"
          echo "--- Server logs ---"
          tail -50 storage/logs/ci-server.log || echo "No server log file"
          echo "--- Process list ---"
          ps aux | grep php || echo "No php processes"
          echo "--- Last curl attempt ---"
          curl -v http://127.0.0.1:8000/prijava || echo "Curl failed"
          exit 1
      - run: npm run test:e2e
      - run: npm run test:e2e:pages
      - run: npm run test:e2e:map-workflow
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: map-smoke-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            storage/logs/*.log
            storage/logs/*.png
